<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside The Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Editorial+New:ital@0;1&family=Suisse+Int%27l:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #fafafa;
    --grey-100: #f2f2f0;
    --grey-200: #e8e8e5;
    --grey-400: #a0a09a;
    --grey-600: #6b6b65;
    --accent: #0a0a0a;
    --border: rgba(10,10,10,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--white);
    color: var(--black);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── LANDING BANNER ── */
  .landing-banner-wrap {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 200px;
    overflow: hidden;
    flex-shrink: 0;
    z-index: 1;
    background: var(--white);
  }

  .landing-banner-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 42%;
    display: block;
    filter: none;
  }



  /* ── LANDING ── */
  #landing {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.6s ease, transform 0.6s ease;
    overflow: hidden;
  }

  #landing.hidden {
    opacity: 0;
    transform: translateY(-20px);
    pointer-events: none;
  }

  .landing-logo {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin-bottom: 6px;
    position: relative;
    z-index: 2;
    margin-top: 200px;
  }

  .landing-sub {
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 56px;
    position: relative;
    z-index: 2;
  }

  .landing-search-wrap {
    position: relative;
    width: min(640px, 90vw);
    z-index: 2;
  }

  .landing-input {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    padding: 18px 56px 18px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 300;
    color: #ffffff;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .landing-input::placeholder { color: rgba(255,255,255,0.35); }
  .landing-input:focus {
    border-color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.1);
  }

  .landing-send {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: rgba(255,255,255,0.4);
    transition: color 0.2s;
    display: flex;
    align-items: center;
  }
  .landing-send:hover { color: #ffffff; }

  .landing-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
    width: min(640px, 90vw);
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .pill {
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 100px;
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .pill:hover {
    background: #ffffff;
    color: #000000;
    border-color: #ffffff;
  }

  .landing-footer {
    position: absolute;
    bottom: 28px;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }

  .doac-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .doac-dot {
    width: 6px;
    height: 6px;
    background: #ffffff;
    border-radius: 50%;
    display: inline-block;
  }

  /* ── CHAT LAYOUT ── */
  #chat-view {
    display: flex;
    flex-direction: column;
    height: 100vh;
    opacity: 0;
    transition: opacity 0.4s ease 0.3s;
  }

  #chat-view.visible { opacity: 1; }

  /* Header */
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 56px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--black);
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .header-logo:hover { opacity: 0.6; }

  .header-model {
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--grey-400);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .model-dot {
    width: 5px;
    height: 5px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header-new {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    color: var(--grey-600);
    cursor: pointer;
    transition: all 0.2s;
  }
  .header-new:hover {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
  }

  /* Messages */
  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 40px 0;
    scroll-behavior: smooth;
  }

  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-track { background: transparent; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--grey-200); border-radius: 2px; }

  .msg-container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .msg {
    margin-bottom: 32px;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-user {
    display: flex;
    justify-content: flex-end;
  }

  .msg-user .bubble {
    background: var(--grey-100);
    border-radius: 4px 4px 0 4px;
    padding: 12px 16px;
    max-width: 75%;
    font-size: 0.9rem;
    line-height: 1.6;
  }

  .msg-ai {}

  .ai-label {
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--grey-400);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ai-label-dot {
    width: 5px;
    height: 5px;
    background: var(--black);
    border-radius: 50%;
  }

  .ai-content {
    font-size: 0.92rem;
    line-height: 1.75;
    color: var(--black);
  }

  .ai-content p { margin-bottom: 14px; line-height: 1.75; }
  .ai-content p:last-child { margin-bottom: 0; }

  .ai-content strong {
    font-weight: 500;
    color: var(--black);
  }

  .ai-content em {
    font-style: italic;
  }

  .ai-content br + br {
    display: block;
    content: "";
    margin-top: 4px;
  }

  .inline-link {
    color: var(--black) !important;
    text-decoration: none;
    border-bottom: 1px solid var(--black);
    padding-bottom: 1px;
    font-weight: 400;
    transition: opacity 0.15s;
  }
  .inline-link:hover { opacity: 0.45; }

  .list-num {
    font-weight: 500;
    min-width: 18px;
    display: inline-block;
  }

  /* Episode cards */
  .episode-cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }

  .ep-card {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }

  .ep-card:hover {
    border-color: var(--black);
    background: var(--grey-100);
  }

  .ep-thumb {
    width: 80px;
    height: 52px;
    background: var(--grey-200);
    border-radius: 2px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  .ep-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ep-thumb-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--black);
    color: var(--white);
    font-family: 'DM Serif Display', serif;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
  }

  .ep-info { flex: 1; }

  .ep-guest {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--grey-600);
    margin-bottom: 2px;
  }

  .ep-title {
    font-family: 'DM Serif Display', serif;
    font-size: 0.92rem;
    line-height: 1.35;
    color: var(--black);
    margin-bottom: 4px;
  }

  .ep-meta {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ep-timestamp {
    font-size: 0.72rem;
    color: var(--grey-400);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .ep-timestamp svg { width: 10px; height: 10px; }

  .ep-watch {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--black);
    text-decoration: none;
    border-bottom: 1px solid var(--black);
    padding-bottom: 1px;
    transition: opacity 0.2s;
  }
  .ep-watch:hover { opacity: 0.5; }

  /* Thinking indicator */
  .thinking {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 0;
  }

  .thinking-dot {
    width: 5px;
    height: 5px;
    background: var(--grey-400);
    border-radius: 50%;
    animation: thinking 1.2s infinite;
  }

  .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes thinking {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-4px); opacity: 1; }
  }

  /* Input bar */
  .input-bar {
    padding: 16px 24px 24px;
    flex-shrink: 0;
  }

  .input-inner {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }

  .chat-input {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    padding: 14px 52px 14px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 300;
    color: var(--black);
    outline: none;
    resize: none;
    min-height: 52px;
    max-height: 160px;
    line-height: 1.5;
    transition: border-color 0.2s, background 0.2s;
  }

  .chat-input::placeholder { color: var(--grey-400); }
  .chat-input:focus {
    border-color: var(--black);
    background: var(--white);
  }

  .send-btn {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 28px;
    height: 28px;
    background: var(--black);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
  }

  .send-btn:hover { opacity: 0.75; }
  .send-btn:disabled { opacity: 0.3; cursor: default; }

  .input-footer {
    text-align: center;
    margin-top: 10px;
    font-size: 0.68rem;
    color: var(--grey-400);
    letter-spacing: 0.06em;
  }

  /* Divider */
  .divider {
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 4px 0 16px;
  }

  /* Source list */
  .source-list {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .source-heading {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--grey-400);
    margin-bottom: 10px;
  }

  .source-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .source-chip {
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 100px;
    padding: 4px 10px;
    font-size: 0.72rem;
    color: var(--grey-600);
    text-decoration: none;
    transition: all 0.2s;
  }
  .source-chip:hover {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
  }

  /* Welcome state in chat */
  .chat-welcome {
    text-align: center;
    padding: 60px 24px 0;
    max-width: 520px;
    margin: 0 auto;
  }

  .chat-welcome h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .chat-welcome p {
    font-size: 0.85rem;
    color: var(--grey-600);
    line-height: 1.6;
  }
</style>
</head>

// ══════════ SYSTEM PROMPT ══════════
function buildSystemPrompt() {
  const episodeContext = EPISODE_DB.map(ep => {
    const clipText = ep.clips.map(c =>
      `  - [${c.timestamp}] "${c.quote}" — topic: ${c.topic} | YouTube: https://youtube.com/watch?v=${c.youtube_id}&t=${c.t}`
    ).join('\n');
    return `EPISODE: "${ep.title}"
Guest: ${ep.guest}
Topics: ${ep.topics.join(', ')}
Summary: ${ep.summary}
Key Clips:
${clipText}
YouTube: https://youtube.com/watch?v=${ep.youtube_id}`;
  }).join('\n\n---\n\n');

  return `You are doac — the AI research assistant for Inside The Diary, a tool built on the complete episode library of The Diary Of A CEO podcast hosted by Steven Bartlett.

YOUR RULES (strictly follow these):
1. You ONLY use information from the DOAC episode library below. Never use outside knowledge.
2. Be concise and conversational first — like a smart friend who's watched every DOAC episode. Don't over-explain.
3. Match response length to the question. Simple question = 2-3 sentences. Complex question = short paragraphs. Never pad responses.
4. Always include at least one timestamped clip link per response using: [▶ Guest Name, Timestamp](URL). Clips are non-negotiable — they are the core value of this tool.
5. Only quote directly when the exact words genuinely add value. Otherwise paraphrase tightly in your own words.
6. Never include more than 2 clip links per response — pick the most relevant moments only.
7. If a question can't be answered from the library say so in one sentence, then pivot to the closest relevant insight you do have.
8. Do not say "As an AI" or refer to yourself as Claude. You are doac.
9. Never use ## headers or # symbols. Never use raw asterisks. Bold only guest names using **Name**. Keep formatting clean and minimal.
10. Tone: direct, sharp, editorial. Like a brilliant researcher who respects the user's time.

EPISODE LIBRARY:
${episodeContext}`;
}

// ══════════ STATE ══════════
let messages = [];
let isThinking = false;

// ══════════ DOM ══════════
const landing = document.getElementById('landing');

const messagesContainer = document.getElementById('messages-container');
const messagesArea = document.getElementById('messages-area');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const landingInput = document.getElementById('landing-input');

// ══════════ NAVIGATION ══════════
function showChat() {
  landing.classList.add('hidden');

    chatView.style.display = 'none';

}

function newChat() {

  messagesContainer.innerHTML = '';

}

function startFromPill(el) {

  showChat();
  setTimeout(() => sendMessage(query), 400);
}

// ══════════ WELCOME STATE ══════════
function appendWelcome() {
  const div = document.createElement('div');
  div.className = 'chat-welcome';
  div.id = 'chat-welcome';
  div.innerHTML = `
    <h2>What would you like to explore?</h2>
    <p>Ask anything — find clips, combine insights from multiple guests, or dive deep into a topic from the DOAC episode library.</p>
  `;
  messagesContainer.appendChild(div);
}

// ══════════ RENDER MESSAGES ══════════
function renderUserMsg(text) {
  const welcome = document.getElementById('chat-welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
  messagesContainer.appendChild(div);
  scrollBottom();
}

function renderThinking() {
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.id = 'thinking-msg';
  div.innerHTML = `
    <div class="ai-label"><span class="ai-label-dot"></span>doac</div>
    <div class="thinking">
      <div class="thinking-dot"></div>
      <div class="thinking-dot"></div>
      <div class="thinking-dot"></div>
    </div>`;
  messagesContainer.appendChild(div);
  scrollBottom();
}

function removeThinking() {
  const el = document.getElementById('thinking-msg');
  if (el) el.remove();
}

function renderAIMsg(text, episodeRefs) {
  const div = document.createElement('div');
  div.className = 'msg msg-ai';

  // Parse markdown-ish formatting
  const formatted = formatResponse(text);

  let episodeHTML = '';
  if (episodeRefs && episodeRefs.length > 0) {
    const chips = episodeRefs.map(ep =>
      `<a class="source-chip" href="https://youtube.com/watch?v=${ep.youtube_id}" target="_blank">▶ ${ep.guest}</a>`
    ).join('');
    episodeHTML = `
      <div class="source-list">
        <div class="source-heading">Episodes referenced</div>
        <div class="source-chips">${chips}</div>
      </div>`;
  }

  div.innerHTML = `
    <div class="ai-label"><span class="ai-label-dot"></span>doac</div>
    <div class="ai-content">${formatted}</div>
    ${episodeHTML}
  `;
  messagesContainer.appendChild(div);
  scrollBottom();
}

function formatResponse(text) {
  // Strip ## headers — render as bold section labels instead
  text = text.replace(/^#{1,3}\s+(.+)$/gm, (_, t) => `\n**${t}**\n`);
  // Convert bullet * or - at line start to clean bullet
  text = text.replace(/^[\*\-]\s+/gm, '• ');
  // Convert **bold**
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Convert *italic*
  text = text.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
  // Convert markdown links to styled inline links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="inline-link">$1 ↗</a>');
  // Convert numbered lists
  text = text.replace(/^(\d+)\.\s+/gm, (_, n) => `<span class="list-num">${n}.</span> `);
  // Split into paragraphs on double newlines
  const paras = text.split(/\n\n+/).filter(p => p.trim());
  return paras.map(p => {
    const lines = p.split('\n').join('<br>');
    return `<p>${lines}</p>`;
  }).join('');
}



function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scrollBottom() {
  setTimeout(() => {
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }, 50);
}

// ══════════ SEND MESSAGE ══════════
async function sendMessage(overrideText) {
  const text = (overrideText || chatInput.value).trim();
  if (!text || isThinking) return;

  chatInput.value = '';
  chatInput.style.height = 'auto';
  isThinking = true;
  sendBtn.disabled = true;

  renderUserMsg(text);
  renderThinking();

  messages.push({ role: 'user', content: text });

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: buildSystemPrompt(),
        messages: messages
      })
    });

    if (!response.ok) throw new Error('API error');

    removeThinking();

    // Build the streaming message container
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg msg-ai';
    const labelDiv = document.createElement('div');
    labelDiv.className = 'ai-label';
    labelDiv.innerHTML = '<span class="ai-label-dot"></span>doac';
    const contentDiv = document.createElement('div');
    contentDiv.className = 'ai-content';
    const p = document.createElement('p');
    contentDiv.appendChild(p);
    msgDiv.appendChild(labelDiv);
    msgDiv.appendChild(contentDiv);
    messagesContainer.appendChild(msgDiv);
    scrollBottom();

    // Read the SSE stream
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line in buffer

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.text) {
            fullText += parsed.text;
            p.innerHTML = formatResponse(fullText);
            scrollBottom();
          }
        } catch(e) {}
      }
    }

    // Add episode chips after stream completes
    const refs = EPISODE_DB.filter(ep =>
      fullText.toLowerCase().includes(ep.guest.split(' ')[1]?.toLowerCase() || ep.guest.toLowerCase()) ||
      fullText.includes(ep.youtube_id)
    );
    if (refs.length > 0) {
      const chips = refs.map(ep =>
        `<a class="source-chip" href="https://youtube.com/watch?v=${ep.youtube_id}" target="_blank">▶ ${ep.guest}</a>`
      ).join('');
      const sourceDiv = document.createElement('div');
      sourceDiv.className = 'source-list';
      sourceDiv.innerHTML = `<div class="source-heading">Episodes referenced</div><div class="source-chips">${chips}</div>`;
      msgDiv.appendChild(sourceDiv);
    }

    messages.push({ role: 'assistant', content: fullText });
    scrollBottom();

  } catch (err) {
    removeThinking();
    renderAIMsg("Something went wrong connecting to the episode library. Please try again.");
    messages.pop();
  }

  isThinking = false;
  sendBtn.disabled = false;
  chatInput.focus();
}

// ══════════ EVENT LISTENERS ══════════
document.getElementById('landing-send-btn').addEventListener('click', () => {
  const val = landingInput.value.trim();
  if (!val) return;
  showChat();
  setTimeout(() => sendMessage(val), 400);
});

landingInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = landingInput.value.trim();
    if (!val) return;
    showChat();
    setTimeout(() => sendMessage(val), 400);
  }
});

sendBtn.addEventListener('click', () => sendMessage());

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

// ══════════ INIT ══════════
chatView.style.display = 'none';
appendWelcome();
landingInput.focus();
</script>
